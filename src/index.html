<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AMERconvert - Convert and validate CSV/JSON/XLSX segmentation data.">
  <title>AMERconvert</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="script.ts"></script>
  <script type="module" src="jsonValidator.ts"></script> 
</head>
<body>
<div class="hero-header">
  <h1>Amer Converter/Validator</h1>
  <p>Convert <code>.csv</code> or segmentation only <code>.xlsx</code> files into JSON. Validate JSON data.</p>
</div>
<!-- Preferences 
  
<div class="section">
    <h2>Select Preferences</h2>
   <div class="checkbox-group">
  <label><input type="checkbox" id="all" /> All</label>
<label><input type="checkbox" id="retail" /> Retail</label>

<div class="main-grid">
  <div class="section upload-section">
    <h2>Upload File</h2>
    <input type="file" id="fileInput" accept=".csv, .xlsx, .json" />
  </div>
  <div class="section paste-section">
    <h2>Paste Raw Data</h2>
    <textarea id="rawDataInput" placeholder="Paste your raw .csv, .xlsx, or .json data here..."></textarea>
    <button id="processRawDataButton">Process Raw Data</button>
  </div>
  <div class="section output-section">
    <h2>Output</h2>
    <pre id="output">Output will appear here...</pre>
    <button id="copyButton">Copy Output</button>
    <button id="downloadButton">Download JSON</button>
  </div>
  <div class="json-section validator-section">
<h2>Paste JSON here:</h2>
<textarea class="jsonInput" id="jsonInput"></textarea>
    <button id="validateJsonButton">Validate JSON</button>
    <pre id="jsonValidationResult"></pre>
  </div>
</div>
