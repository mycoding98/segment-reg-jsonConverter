<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AMERconvert - Convert and validate CSV/JSON/XLSX segmentation data.">
  <title>AMERconvert</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="../dist/script.js"></script>
  <script type="module" src="../dist/jsonValidator.js"></script> 
</head>
<body>
  <h1>AMERconvert</h1>
  <p>Convert <code>.csv</code> or segmentation <code>.xlsx</code> files into JSON. Validate JSON data.</p>

<!-- Preferences -->
  <div class="section">
    <h2>Select Preferences</h2>
   <div class="checkbox-group">
  <label><input type="checkbox" id="all" /> All</label>
<label><input type="checkbox" id="retail" /> Retail</label>
<label><input type="checkbox" id="ge" /> GE</label>
<label><input type="checkbox" id="league" /> League</label>
</div>
  </div>

  <!-- File upload  -->
  <div class="section">
    <h2>Upload File</h2>
    <input type="file" id="fileInput" accept=".csv, .xlsx, .json" />
  </div>

  <!-- Raw data paste -->
  <div class="section">
    <h2>Paste Raw Data</h2>
    <textarea id="rawDataInput" placeholder="Paste your raw .csv, .xlsx, or .json data here..."></textarea>
    <button id="processRawDataButton">Process Raw Data</button>
  </div>

  <!-- Output -->
  <div class="section">
    <h2>Output</h2>
    <pre id="output">Output will appear here...</pre>
    <button id="copyButton">Copy Output</button>
    <button id="downloadButton">Download JSON</button>
  </div>

  <!-- For JSON Validation -->
<textarea id="jsonInput" placeholder="Paste JSON here" rows="6" cols="50"></textarea>
<button id="validateJsonButton">Validate JSON</button>
<pre id="jsonValidationResult"></pre>
</body>
</html>
