<!DOCTYPE html><html lang=en><meta name=viewport content="width=device-width, initial-scale=1.0"><meta name=description content="AMERconvert - Convert and validate CSV/JSON/XLSX segmentation data."><title>AMERconvert</title><link rel=icon href=data:,><link rel=stylesheet href=AMERconvert.515da292.css><script src=https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js></script><script type=module src=AMERconvert.8b1e9e8c.js></script><script type=module src=AMERconvert.0c0952fc.js></script><body>
  <h1>AMERconvert</h1>
  <p>Convert <code>.csv</code> or segmentation <code>.xlsx</code> files into JSON. Validate JSON data.</p>



  <div class=section>
    <h2>Upload File</h2>
    <input type=file id=fileInput accept=.csv,.xlsx,.json>
  </div>
  <div class=section>
    <h2>Paste Raw Data</h2>
    <textarea id=rawDataInput placeholder="Paste your raw .csv, .xlsx, or .json data here..."></textarea>
    <button id=processRawDataButton>Process Raw Data</button>
  </div>
  <div class=section>
    <h2>Output</h2>
    <pre id=output>Output will appear here...</pre>
    <button id=copyButton>Copy Output</button>
    <button id=downloadButton>Download JSON</button>
  </div>
  <div class=json-section>
    <label for=jsonInput>Paste JSON here:</label>
    <textarea class=jsonInput id=jsonInput></textarea>
    <button id=validateJsonButton>Validate JSON</button>
    <pre id=jsonValidationResult></pre>
  </div>
